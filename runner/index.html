<meta name="description" content="An endless runner in a neon city at night. Dodge trains, grab coins and race an AI that taught itself to play, free in your browser.">
<meta name="theme-color" content="#1a2350">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Lights-Out Surfer">
<meta property="og:title" content="Lights-Out Surfer">
<meta property="og:description" content="An endless runner in a neon city at night. Dodge trains, grab coins and race an AI that taught itself to play, free in your browser.">
<meta property="og:url" content="https://surfer.theonlygoatsan.com/">
<meta property="og:image" content="https://surfer.theonlygoatsan.com/og.png">

<meta name="twitter:title" content="Lights-Out Surfer">
<meta name="twitter:description" content="An endless runner in a neon city at night. Dodge trains, grab coins and race an AI that taught itself to play, free in your browser.">

<link rel="stylesheet" href="/src/web/styles/game.css">
</head>
<body>
<div class="overlay" id="overlay">
 <div class="card">
  <h1 id="title">Lights-Out Surfer</h1>
  <p id="sub">Make it home before lights-out.</p>
  <button class="more" id="more">Change runner or level</button>
  <div class="picker" id="picker">
    <button class="arrow" id="prev" aria-label="Previous runner">‹</button>
    <div class="who"><b id="charName">Kai</b><small>your runner</small></div>
    <button class="arrow" id="next" aria-label="Next runner">›</button>
  </div>
  <div class="levels" role="radiogroup" aria-label="Difficulty">
    <button data-level="0" role="radio">Easy</button><button data-level="1" role="radio">Normal</button><button data-level="2" role="radio">Hard</button>
  </div>
  <p class="level-info">This also sets how good the AI is.</p>
  <label class="name">Your name<input id="name" maxlength="16" autocomplete="off" spellcheck="false" placeholder="Player"></label>
  <div class="buttons">
    <button class="primary" id="play">Run</button>
    <button id="race" hidden>Race the AI</button>
  </div>
  <button class="more watch-link" id="watch">Watch the AI play by itself</button>
  <p class="hint"><kbd>←</kbd> <kbd>→</kbd> change lane · <kbd>↑</kbd> jump · <kbd>↓</kbd> roll · or swipe</p>
 </div>
</div>
<script type="module" src="/src/web/main.ts"></script>
</body>
</html>
