<body>
<div class="overlay" id="overlay">
 <div class="card">
  <a class="gh" href="https://github.com/GOATsann/goatsan-lab/tree/main/runner" target="_blank" rel="noopener noreferrer" aria-label="Source code on GitHub" title="Source code on GitHub"><svg viewBox="0 0 16 16" width="22" height="22" aria-hidden="true" focusable="false"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a>
  <h1 id="title">Lights-Out Surfer</h1>
  <p id="sub">Make it home before lights-out.</p>
  <button class="more" id="more">Change runner or level</button>
  <div class="picker" id="picker">
    <button class="arrow" id="prev" aria-label="Previous runner">‹</button>
    <div class="who"><b id="charName">Kai</b><small>your runner</small></div>
    <button class="arrow" id="next" aria-label="Next runner">›</button>
  </div>
  <div class="levels" role="radiogroup" aria-label="Difficulty">
    <button data-level="0" role="radio">Easy</button><button data-level="1" role="radio">Normal</button><button data-level="2" role="radio">Hard</button>
  </div>
  <p class="level-info">This also sets how good the AI is.</p>
  <label class="name">Your name<input id="name" maxlength="16" autocomplete="off" spellcheck="false" placeholder="Player"></label>
  <div class="buttons">
    <button class="primary" id="play">Run</button>
    <button id="race" hidden>Race the AI</button>
  </div>
  <div class="save" id="saveRow" hidden>
    <button class="save-btn" id="save">Save score</button>
    <p class="save-msg" id="saveMsg" role="status"></p>
  </div>
  <div class="links-row">
    <button class="more watch-link" id="watch">Watch the AI play by itself</button>
    <button class="more watch-link" id="boardBtn">Leaderboard</button>
  </div>
  <p class="hint"><kbd>←</kbd> <kbd>→</kbd> change lane · <kbd>↑</kbd> jump · <kbd>↓</kbd> roll · or swipe</p>
 </div>
</div>
<div class="overlay board" id="board" hidden>
 <div class="card">
  <h2 class="board-title">Leaderboard</h2>
  <div class="levels" role="radiogroup" aria-label="Board">
    <button data-board="0" role="radio">Easy</button><button data-board="1" role="radio">Normal</button><button data-board="2" role="radio">Hard</button>
  </div>
  <ol class="board-list" id="boardList"></ol>
  <p class="save-msg" id="boardMe"></p>
  <button class="save-btn" id="boardClose">Close</button>
 </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="/src/web/main.ts"></script>
</body>
</html>
