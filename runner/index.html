<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Untitled Runner</title>
<style>
  html, body { margin: 0; height: 100%; background: #07080f; overflow: hidden; touch-action: none; }
  body { font: 15px/1.4 system-ui, sans-serif; color: #e9ecf5; }
  canvas { display: block; }
  .hud { position: fixed; top: 12px; left: 16px; right: 16px; display: flex; justify-content: space-between; pointer-events: none; font-variant-numeric: tabular-nums; }
  .hud b { font-size: 1.6rem; }
  .hud small { display: block; color: #9aa3b8; }
  .powers { position: fixed; left: 16px; bottom: 16px; display: flex; gap: 8px; pointer-events: none; }
  .powers span { padding: 4px 10px; border-radius: 99px; background: #1b2033; font-size: 0.8rem; }
  .overlay { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; gap: 10px; background: rgba(7, 8, 15, 0.6); }
  .overlay[hidden] { display: none; }
  .overlay h1 { margin: 0; font-size: 2.2rem; }
  .overlay p { margin: 0; color: #b9c0d4; }
  kbd { padding: 1px 6px; border: 1px solid #39405a; border-radius: 4px; font: inherit; font-size: 0.85em; }
</style>
</head>
<body>
<div class="hud"><div><small>score</small><b id="score">0</b></div><div style="text-align:right"><small id="meta">0 m · 0 coins</small><small id="seed"></small></div></div>
<div class="powers" id="powers"></div>
<div class="overlay" id="overlay">
  <h1 id="title">Untitled Runner</h1>
  <p id="sub">Make it home before lights-out.</p>
  <p><kbd>←</kbd> <kbd>→</kbd> change lane · <kbd>↑</kbd> jump · <kbd>↓</kbd> roll · or swipe</p>
  <p><kbd>Space</kbd> or tap to run</p>
</div>
<script type="module" src="/src/web/main.ts"></script>
</body>
</html>
